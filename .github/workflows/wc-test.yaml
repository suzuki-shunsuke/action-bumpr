---
name: Test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string
permissions: {}
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - uses: ./
        id: bumpr
        with:
          dry_run: "true"
          default_bump_level: patch
      - name: Check outputs
        run: |
          echo "current_version=$CURRENT_VERSION"
          echo "next_version=$NEXT_VERSION"
          echo "message=$MESSAGE"
          test -n "$NEXT_VERSION"
        env:
          CURRENT_VERSION: ${{steps.bumpr.outputs.current_version}}
          NEXT_VERSION: ${{steps.bumpr.outputs.next_version}}
          MESSAGE: ${{steps.bumpr.outputs.message}}

  unit-test:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
